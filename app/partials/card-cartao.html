<div class="cartao-card">
  <div class="cartao-plastico {{item.estilo}}">
    <span class="cartao-chip"></span>
    <span class="cartao-bandeira">{{item.bandeira}}</span>
    <span class="cartao-categoria">{{item.categoria}}</span>
    <span class="cartao-logo">itaú</span>
  </div>
  <h3>{{item.nome}}</h3>
  <p>{{item.destaque}}</p>
  <a href="#!/cartoes" class="link-seta">{{ item.programa === 'todos' ? 'Escolha o seu' : 'Peça o seu' }} <span>&rsaquo;</span></a>
</div>
