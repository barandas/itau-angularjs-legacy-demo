<div class="destaque-card">
  <figure class="destaque-imagem" ng-style="{'background-color': item.cor}">
    <span class="glyphicon glyphicon-picture"></span>
  </figure>
  <h3>{{item.titulo}}</h3>
  <p>{{item.descricao}}</p>
  <a href="#!/" class="link-seta">{{item.cta}} <span>&rsaquo;</span></a>
</div>
